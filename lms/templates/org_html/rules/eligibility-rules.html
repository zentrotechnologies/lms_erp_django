  function initializeStepper() {
    var element = document.querySelector("#kt_stepper_example_clickable");

    if (stepper) {
      stepper.destroy();
      stepper = null;
    }

    if (!element) {
      console.error("Stepper element not found!");
      return;
    }

    stepper = new KTStepper(element);

    stepper.on("kt.stepper.click", function (stepper) {
      stepper.goTo(stepper.getClickedStepIndex());
    });

    stepper.on("kt.stepper.next", function (stepper) {
      stepper.goNext();
    });

    stepper.on("kt.stepper.previous", function (stepper) {
      stepper.goPrevious();
    });

  }


  function handleValidationFailure(message, selector) {
    showErrorToast(message);
    scrollToElement(selector);

    if (stepper) {
      stepper.destroy();
      stepper = null;
    }
  }



  function showErrorToast(message) {
    bootstrap.showToast({
      body: message,
      closeButton: true,
      toastClass: "alert-danger",
      delay: 2000,
    });
  }

  function scrollToElement(selector) {
    $("html, body").animate(
      {
        scrollTop: $(selector).offset().top - 100,
      },
      "slow"
    );
  }

  function get_new_rule_details(country_id) {

        "encrypted": '1'

          var rule_no = ''

          let keyExists = keyValueList.some(item => item.key === country_id);
          if (!keyExists) {
            keyValueList.push({
              key: country_id,
              value: [1]
            });
            rule_no = 1
          } else {
            const foundItem = keyValueList.find(item => item.key === country_id);

  function delete_rule(country_id, rule_id, saved) {

    tok = 'Bearer {{og_token}}'
    Swal.fire({
      html: '<div class="d-flex justify-content-around align-items-center "><h5>Are you sure you want to delete this?</h5></div>',
      position: 'top',
      showCancelButton: true,
      confirmButtonColor: '#dc3545',
      cancelButtonColor: '#6c757d',
      confirmButtonText: 'Delete',
      cancelButtonText: 'No',
      customClass: {
        confirmButton: 'swal-button',
        cancelButton: 'swal-button'
      }
    }).then((result) => {
      if (result.isConfirmed) {
        if (saved) {


          $.ajax({
            url: backendurl + "/api/rules/delete-general-eligibility-rules",
            type: "POST",
            headers: {
              "Authorization": tok,
              "encrypted": '1'
            },
            data: { rule_id: rule_id, country_id: country_id, csrfmiddlewaretoken: "{{csrf_token}}" },

            success: function (data) {
              var decrypt_response = decryptData(data)
              var json_resposne = $.parseJSON(decrypt_response)
              if (json_resposne.n == 1) {
                Swal.fire({
                  html: '<div class="d-flex justify-content-around align-items-center "><h4>' + json_resposne.msg + '</h4></div>',
                  icon: 'success',
                  position: 'top',
                  backdrop: true,
                  customClass: {
                    confirmButton: 'swal-button'
                  }
                }).then(() => {
                  $('#Srule_div' + country_id + '-' + rule_id).remove()
                  const updatedList = removeValueFromCountry(keyValueList, country_id, rule_id);
                });
              } else {
                Swal.fire({
                  html: '<div class="d-flex justify-content-around align-items-center "><h5 class="text-danger">' + json_resposne.msg + '</h5></div>',
                  icon: 'error',
                  position: 'top',
                  backdrop: true,
                  customClass: {
                    confirmButton: 'swal-button'
                  }
                });
              }
            },
            error: function (jqXHR, textStatus, errorThrown) {
              Swal.fire({
                title: 'Error',
                text: jqXHR.responseJSON.Message,
                icon: 'error',
                position: 'top',
                backdrop: true,
                customClass: {
                  confirmButton: 'swal-button'
                }
              });
            }
          });

        } else {
          $('#Urule_div' + country_id + '-' + rule_id).remove()
          const updatedList = removeValueFromCountry(keyValueList, country_id, rule_id);
        }
      }
    });
  }

  function removeValueFromCountry(keyValueList, targetCountryId, targetValue) {
    const countryItem = keyValueList.find(item => item.key === targetCountryId);
    if (countryItem) {
      countryItem.value = countryItem.value.filter(val => val !== targetValue);
    }
    return keyValueList;
  }




  async function get_country_existing_rule_ids(country_id) {
    return new Promise((resolve, reject) => {
      const en_data = {
        'country_id': country_id,
      };
      const check_encryptData = encryptData(JSON.stringify(en_data));
      const tok = 'Bearer {{og_token}}';

      $.ajax({
        type: "POST",
        url: backendurl + "/api/rules/get-country-existing-rule-ids",
        headers: {
          "Authorization": tok,
          "encrypted": '1'
        },
        dataType: "json",
        data: check_encryptData,
        processData: false,
        contentType: false,
        success: function (response) {
          try {
            const decrypt_response = decryptData(response);
            const json_response = JSON.parse(decrypt_response);

            if (json_response.n === 1) {
              resolve(json_response.data || []);
            } else {
              reject(new Error(json_response.msg || 'No data returned'));
            }
          } catch (e) {
            reject(e);
          }
        },
        error: function (xhr, status, error) {
          reject(new Error(`API request failed: ${status} - ${error}`));
        }
      });
    });
  }

  async function save_country_rules(country_id) {
    try {
      showLoading(true);

      const saved_rules_ids = await get_country_existing_rule_ids(country_id);

      const countryItem = keyValueList.find(item => item.key === country_id);
      const all_rules_list = [];
      const error_log = { is_empty: false, field_id: '', msg: '' };

      if (countryItem?.value?.length) {
        for (const o of countryItem.value) {
          const validationError = validateRuleFields(country_id, o, 'U');
          if (validationError) {
            Object.assign(error_log, validationError);
            break;
          }

          all_rules_list.push(collectRuleData(country_id, o, 'U', false));
        }
      }

      for (const o of saved_rules_ids) {
        const validationError = validateRuleFields(country_id, o, 'S');
        if (validationError) {
          Object.assign(error_log, validationError);
          break;
        }

        all_rules_list.push(collectRuleData(country_id, o, 'S', true));
      }

      if (error_log.is_empty) {
        handleValidationFailure(error_log.msg, error_log.field_id);
        return false;
      }

      const en_data = {
        'country_id': country_id,
        'all_rules_list': all_rules_list,
      };

      const result = await saveRulesToBackend(en_data);

      if (result.n === 1) {
        showSuccessMessage("Rules saved successfully");
        return result.data;
      } else {
        throw new Error(result.msg || 'Failed to save rules');
      }
    } catch (error) {
      console.error("Error saving rules:", error);
      showErrorMessage(error.message);
      return false;
    } finally {
      showLoading(false);
    }
  }

  function validateRuleFields(country_id, rule_id, prefix) {
    const fields = [
      { selector: `#${prefix}Departments${country_id}-${rule_id.id || rule_id}`, msg: 'Please select at least one department' },
      { selector: `#${prefix}Ranks${country_id}-${rule_id.id || rule_id}`, msg: 'Please select at least one rank' },
      { selector: `#${prefix}minimum_age${country_id}-${rule_id.id || rule_id}`, msg: 'Please enter minimum age' }
    ];

    for (const field of fields) {
      if (IsValid($(field.selector).val())) {
        return {
          is_empty: true,
          field_id: field.selector,
          msg: field.msg
        };
      }
    }
    return null;
  }

  function collectRuleData(country_id, rule_id, prefix, isSaved) {
    const data = {
      department_ids: $(`#${prefix}Departments${country_id}-${rule_id.id || rule_id}`).val(),
      rank_ids: $(`#${prefix}Ranks${country_id}-${rule_id.id || rule_id}`).val(),
      minimum_age: $(`#${prefix}minimum_age${country_id}-${rule_id.id || rule_id}`).val(),
      qualifications_ids: $(`#${prefix}Qualifications${country_id}-${rule_id.id || rule_id}`).val(),
      mandatory_documents_ids: $(`input[name="${prefix}mandatory_documents${country_id}-${rule_id.id || rule_id}"]:checked`).map(function () {
        return $(this).val();
      }).get(),
      saved: isSaved
    };

    if (isSaved && rule_id) {
      data.id = rule_id;
    }

    return data;
  }

  async function saveRulesToBackend(data) {
    const check_encryptData = encryptData(JSON.stringify(data));
    const tok = 'Bearer {{og_token}}';

    return new Promise((resolve, reject) => {
      $.ajax({
        type: "POST",
        url: backendurl + "/api/rules/save-country-rule-details",
        headers: {
          "Authorization": tok,
          "encrypted": '1'
        },
        dataType: "json",
        data: check_encryptData,
        processData: false,
        contentType: false,
        success: function (response) {
          try {
            const decrypt_response = decryptData(response);
            pagination()
            resolve(JSON.parse(decrypt_response));
          } catch (e) {
            reject(e);
          }
        },
        error: function (xhr, status, error) {
          reject(new Error(`Save failed: ${status} - ${error}`));
        }
      });
    });
  }

  function showLoading(show) {
    if (show) {
      $('#loading-spinner').show();
      $('button').prop('disabled', true);
    } else {
      $('#loading-spinner').hide();
      $('button').prop('disabled', false);
    }
  }

    Swal.fire({
      html: '<div class="d-flex justify-content-around align-items-center"><h5 class="text-success">' + message + '</h5></div>',
      icon: 'success',
      position: 'top',
      backdrop: true,

    })
  }

  function showErrorMessage(message) {
    Swal.fire({
      html: '<div class="d-flex justify-content-around align-items-center"><h5 class="text-danger">' + message + '</h5></div>',
      icon: 'error',
      position: 'top',
      backdrop: true,

    })
  }

  function get_department_ranks(country_id,rule_id,prefix,isSaved,general_eligibility_rule_id) {

    var department_ids=$('#'+prefix+'Departments'+country_id+'-'+rule_id).val()
    var previously_selected_ranks=$('#'+prefix+'Ranks'+country_id+'-'+rule_id).val()
    var en_data = {
      'department_ids': department_ids,
      'country_id':country_id,
      'general_eligibility_rule_id':general_eligibility_rule_id,

    }
    tok = 'Bearer {{og_token}}'
    var check_encryptData = encryptData(JSON.stringify(en_data))

    $.ajax({
      url: backendurl + "/api/rules/get-unmapped-ranks",
      type: "POST",
      headers: {
        "Authorization": tok,
        "encrypted": '1'
      },
      dataType: "json",
      data: check_encryptData,
      processData: false,
      contentType: false,

      success: function (data) {
        var decrypt_response = decryptData(data)
        var json_resposne = $.parseJSON(decrypt_response)
        if (json_resposne.n == 1) {
          console.log('Success', json_resposne);
          var options = `<option value="">Select Ranks</option>`
          $.each(json_resposne.data, function (i, o) {
            if(o.id in previously_selected_ranks){
            options += `<option value="` + o.id + `" selected>` + o.rank + `</option>`
            }else{
            options += `<option value="` + o.id + `">` + o.rank + `</option>`

            }
          })
          $('#'+prefix+'Ranks'+country_id+'-'+rule_id).html(options)
          $('#'+prefix+'Ranks'+country_id+'-'+rule_id).val(previously_selected_ranks).trigger('change')

        } else {
          console.log('Success-Error');
          Swal.fire({
            html: '<div class="d-flex justify-content-around align-items-center "><h5 class="text-danger">' + json_resposne.msg + '</h5></div>',
            icon: 'error',
            position: 'top',
            backdrop: true,
            customClass: {
              confirmButton: 'swal-button'
            }
          });
        }
      },
      error: function (jqXHR, textStatus, errorThrown) {
        console.log(textStatus, errorThrown);
        Swal.fire({
          title: 'Error',
          text: jqXHR.responseJSON.Message,
          icon: 'error',
          position: 'top',
          backdrop: true,
          customClass: {
            confirmButton: 'swal-button'
          }
        });
      }
    });

  }
