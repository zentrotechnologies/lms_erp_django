<!doctype html>
<html lang="en">
<!--begin::Head-->

<head>
  {%load static%}
  <base href="" />
  <title>LMS</title>
  <meta charset="utf-8" />
  <meta name="description" content="" />
  <meta name="keywords" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="" />
  <meta property="og:url" content="" />
  <meta property="og:site_name" content="" />
  <link rel="canonical" href="" />
  <link rel="shortcut icon" href="" />
  <!--begin::Fonts(mandatory for all pages)-->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700" />
  <!--end::Fonts-->
  <!--begin::Global Stylesheets Bundle(mandatory for all pages)-->
  <link href="{% static 'assets/plugins/global/plugins.bundle.css'%}" rel="stylesheet" type="text/css" />
  <link href="{% static 'assets/css/style.bundle.css'%}" rel="stylesheet" type="text/css" />
  <!--end::Global Stylesheets Bundle-->


</head>
<!--end::Head-->
<!--begin::Body-->

<body id="kt_body" class="app-blank bgi-size-cover bgi-attachment-fixed bgi-position-center">
  <!--begin::Root-->
  <div class="d-flex flex-column flex-root h-lg-100"
    style="background-image: url(&quot;assets/media/auth/bg10.jpeg&quot;)">
    <!--begin::Page bg image-->
    <!--end::Page bg image-->
    <!--begin::Authentication - Sign-in -->
    <div class="container">
      <div class="d-flex flex-column flex-lg-row flex-column-fluid align-items-center h-lg-100vh py-15">
        <!--begin::Aside-->
        <div class="d-flex flex-lg-row-fluid">
          <!--begin::Content-->
          <div class="d-flex flex-column flex-center pb-0 pb-lg-10 p-10 w-100">
            <!--begin::Image-->
            <img class="theme-light-show mx-auto mw-100 w-150px w-lg-400px"
              src="{% static 'assets/media/auth/agency.png'%}" alt="" />
            <!--end::Image-->
          </div>
          <!--end::Content-->
        </div>
        <!--begin::Aside-->
        <!--begin::Body-->
        <div class="d-flex flex-column-fluid flex-lg-row-auto justify-content-center justify-content-lg-end p-12">
          <!--begin::Wrapper-->
          <div class="bg-body d-flex flex-column flex-center rounded-2 w-md-400px px-10 py-20">
            <!--begin::Content-->
            <div class="d-flex flex-center flex-column align-items-stretch h-lg-100 w-md-300px">
              <!--begin::Wrapper-->
              <div class="d-flex flex-center flex-column flex-column-fluid">
                <!-- <div class="login-logo">
									<img src="assets/img/logo.png" class="img-fluid h-60px mb-10">
								</div> -->
                <!--begin::Form-->
                <form class="form w-100" method="POST">

                  {%csrf_token%}
                  <!--begin::Heading-->
                  <div class="text-center mb-11">
                    <!--begin::Title-->
                    <h1 class="text-gray-900 fw-bolder mb-3">Sign In</h1>
                    <!--end::Title-->
                  </div>
                  <!--begin::Heading-->
                  <!--begin::Input group=-->
                  <div class="fv-row mb-8">
                    <!--begin::Email-->
                    <label class="pb-2">Email</label>
                    <input type="text" placeholder="Email" name="email" autocomplete="off" class="form-control" />
                    <!--end::Email-->
                  </div>
                  <!--end::Input group=-->
                  <div class="fv-row mb-3">
                    <!--begin::Password-->
                    <label class="pb-2">Password</label>
                    <input type="password" placeholder="Password" name="password" autocomplete="off"
                      class="form-control" />
                    <!--end::Password-->
                  </div>
                  <!--end::Input group=-->
                  <!--begin::Wrapper-->
                  <div class="d-flex flex-stack flex-wrap gap-3 fs-base fw-semibold mb-8">
                    <div></div>
                  </div>
                  <!--end::Wrapper-->
                  <!--begin::Submit button-->
                  <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                      <!--begin::Indicator label-->
                      <span class="indicator-label">Sign In</span>
                      <!--end::Indicator label-->
                      <!--begin::Indicator progress-->
                      <span class="indicator-progress">Please wait...
                        <span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
                      <!--end::Indicator progress-->
                    </button>
                  </div>
                  <!--end::Submit button-->
                </form>
                <!--end::Form-->
              </div>
              <!--end::Wrapper-->
            </div>
            <!--end::Content-->
          </div>
          <!--end::Wrapper-->
        </div>
        <!--end::Body-->
      </div>
      <!--end::Authentication - Sign-in-->
    </div>
  </div>
  <!--end::Root-->
  <!--begin::Javascript-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3">
  {% for message in messages %}
    <div class="toast align-items-center text-white bg-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          {{ message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  {% endfor %}
</div>

<script>
  $(document).ready(function() {
    $('.toast').toast('show');
    
    // Auto-hide after delay
    setTimeout(function() {
      $('.toast').toast('hide');
    }, 2000);
    
    $("html, body").animate({ scrollTop: 0 }, "slow");
  });
</script>
{% endif %}
  <script>
    var hostUrl = "assets/";
  </script>
  <!--begin::Global Javascript Bundle(mandatory for all pages)-->
  <script src="{% static 'assets/plugins/global/plugins.bundle.js'%}"></script>
  <script src="{% static 'assets/js/scripts.bundle.js'%}"></script>
  <!--end::Global Javascript Bundle-->
  <!--begin::Custom Javascript(used for this page only)-->
  <script src="{% static 'assets/js/custom/authentication/sign-in/general.js'%}"></script>
  <!--end::Custom Javascript-->
  <!--end::Javascript-->
</body>
<!--end::Body-->

</html>
